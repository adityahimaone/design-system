<text x="1060" y="62" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="10" fill="#1B2030" >GLOAMING / SHEET 01</text><text x="1060" y="80" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="9" fill="#1B2030" >CASE 25 · #19 LIQUID GLASS</text>
<text x="60" y="130" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="10" fill="#1B2030" >01 / CONCENTRIC RADII — the corner is a closed chain, not three numbers</text>
<rect x="60" y="150" width="400" height="286" rx="22" fill="none" stroke="#1B2030" stroke-width="1.6" /><rect x="74" y="164" width="372" height="258" rx="18" fill="none" stroke="#1B2030" stroke-width="1" stroke-dasharray="4 3"/><rect x="88" y="178" width="344" height="230" rx="10" fill="none" stroke="#1B2030" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="60" y1="452" x2="460" y2="452" stroke="#1B2030" stroke-opacity=".42" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="470" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="9" fill="#1B2030" >R1 = 22  R2 = R1 - 4 = 18  R3 = R2 - 8 = 10</text>
<text x="60" y="488" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="8" fill="#1B2030" >R_n = R_1 - sum(delta_1..delta_n) · every inner radius inherits its parent</text>
<text x="60" y="512" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="10" fill="#1B2030" >02 / SPACING CHAIN — S_n = 8n, tabular, no optical adjustment</text>
