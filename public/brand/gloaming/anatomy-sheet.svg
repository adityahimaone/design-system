<line x1="60" y1="610" x2="76" y2="610" stroke="#1B2030" stroke-opacity=".42" stroke-width="1" /><text x="86" y="614" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="8" fill="#1B2030" >H1 = 48 + 8n = 56</text><line x1="60" y1="632" x2="76" y2="632" stroke="#1B2030" stroke-opacity=".42" stroke-width="1" /><text x="86" y="636" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="8" fill="#1B2030" >H2 = 48 + 8n = 64</text><line x1="60" y1="654" x2="76" y2="654" stroke="#1B2030" stroke-opacity=".42" stroke-width="1" /><text x="86" y="658" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="8" fill="#1B2030" >H3 = 48 + 8n = 72</text><line x1="60" y1="676" x2="76" y2="676" stroke="#1B2030" stroke-opacity=".42" stroke-width="1" /><text x="86" y="680" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="8" fill="#1B2030" >H4 = 48 + 8n = 80</text><line x1="60" y1="698" x2="76" y2="698" stroke="#1B2030" stroke-opacity=".42" stroke-width="1" /><text x="86" y="702" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="8" fill="#1B2030" >H5 = 48 + 8n = 88</text>
<line x1="520" y1="120" x2="520" y2="940" stroke="#1B2030" stroke-opacity=".42" stroke-width="1" stroke-dasharray="3 3"/>
<text x="560" y="130" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="10" fill="#1B2030" >04 / EXPLODED LAYER STACK — four plates, one light source</text>
<polygon points="760,200 1090,200 1160,252 830,252" fill="#F6F0E5" stroke="#1B2030" stroke-width="1.2"/><text x="772" y="228" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="8" fill="#1B2030" >PLATE A · HAZY PHOTOGRAPH (one image, no stack)</text><polygon points="788,268 1118,268 1188,320 858,320" fill="#F6F0E5" stroke="#1B2030" stroke-width="1.2"/><text x="800" y="296" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="8" fill="#1B2030" >PLATE B · 26px REFRACTING PANE + 1px INSET RIM</text><polygon points="816,336 1146,336 1216,388 886,388" fill="#F6F0E5" stroke="#1B2030" stroke-width="1.2"/><text x="828" y="364" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="8" fill="#1B2030" >PLATE C · 1px MULLIONS + ONE LIT TOP EDGE</text><polygon points="844,404 1174,404 1244,456 914,456" fill="#E7E1D5" stroke="#1B2030" stroke-width="1.2"/><text x="856" y="432" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="8" fill="#1B2030" >PLATE D · SOLID OAT READING PLATE</text>
<line x1="830" y1="182" x2="1330" y2="182" stroke="#1B2030" stroke-opacity=".42" stroke-width="1" stroke-dasharray="3 3"/><text x="1090" y="174" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="8" fill="#1B2030" >ONE SPECULAR TOP EDGE</text>
<text x="560" y="620" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="10" fill="#1B2030" >05 / PHYSICS</text>
<text x="560" y="648" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="9" fill="#1B2030" >· blur(pane) = 26px · saturate(1.25) · one value only</text><text x="560" y="672" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="9" fill="#1B2030" >· mullion = 1px · outset shadow · never a gap</text><text x="560" y="696" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="9" fill="#1B2030" >· rim = 1px inset at 9% ink</text><text x="560" y="720" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="9" fill="#1B2030" >· reading copy = solid oat plate · never on the pane</text><text x="560" y="744" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="9" fill="#1B2030" >· motion = 180ms cubic-bezier(.2,.7,.2,1)</text><text x="560" y="768" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="9" fill="#1B2030" >· measure = 64ch · display ≤ 2 lines at 390</text>
<line x1="24" y1="830" x2="1376" y2="830" stroke="#1B2030" stroke-opacity=".42" stroke-width="1" />
<text x="60" y="858" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="10" fill="#1B2030" >06 / CLOSED-FORM LEDGER</text>
<text x="60" y="882" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="9" fill="#1B2030" >R_inner = R_outer - 4     S_n = 8n     H_row = 48 + 8n     pane = 26px     mullion = 1px     radius = 22px</text>
<text x="60" y="906" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="9" fill="#1B2030" >The pane never carries type. The plate never refracts. One horizon cut separates them.</text>
<text x="60" y="936" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="8" fill="#1B2030" >S1..S6  H1..H5  R1..R3  ·  monochrome redline  ·  Gloaming V1.0  ·  generated by scripts/build-gloaming.mjs</text>
<text x="1120" y="936" style="font-family:'Martian Mono',ui-monospace,monospace" font-size="9" fill="#1B2030" >SHEET 01 / 01</text>
