<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Gloaming crisp ordered Bayer matrix field">
  <defs>
    <pattern id="gloaming-bayer-4x4" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#2B3D69"/>
      <rect x="0" y="0" width="2" height="2" fill="#1B2030" fill-opacity="0.16"/>
      <rect x="4" y="0" width="2" height="2" fill="#E2A38C" fill-opacity="0.24"/>
      <rect x="2" y="2" width="2" height="2" fill="#1B2030" fill-opacity="0.10"/>
      <rect x="6" y="2" width="2" height="2" fill="#75769C" fill-opacity="0.30"/>
      <rect x="0" y="4" width="2" height="2" fill="#75769C" fill-opacity="0.30"/>
      <rect x="4" y="4" width="2" height="2" fill="#1B2030" fill-opacity="0.14"/>
      <rect x="2" y="6" width="2" height="2" fill="#E2A38C" fill-opacity="0.20"/>
      <rect x="6" y="6" width="2" height="2" fill="#1B2030" fill-opacity="0.18"/>
    </pattern>
    <pattern id="gloaming-halftone-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.75" fill="#E2A38C" fill-opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#2B3D69"/>
  <rect width="1600" height="1000" fill="url(#gloaming-bayer-4x4)"/>
  <rect width="1600" height="1000" fill="url(#gloaming-halftone-dots)"/>
</svg>
