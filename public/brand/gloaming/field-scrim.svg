      <stop offset="0%" stop-color="#2B3D69" stop-opacity="0.98"/>
      <stop offset="38%" stop-color="#2B3D69" stop-opacity="0.90"/>
      <stop offset="68%" stop-color="#2B3D69" stop-opacity="0.45"/>
