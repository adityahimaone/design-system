<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Halation — social card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500&family=Syne:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #240309;
        font-family: 'Schibsted Grotesk', system-ui, sans-serif;
        color: #fbeae6;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 64px 68px 56px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        isolation: isolate;
      }
      /* the ember field, held back so type never fights it */
      .field {
        position: absolute;
        inset: 0;
        background: url('field-ember.jpg') center / cover;
        z-index: -2;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(120% 90% at 8% 18%, rgb(11 4 9 / 0.94), rgb(11 4 9 / 0.4) 58%, transparent 82%),
          linear-gradient(105deg, rgb(11 4 9 / 0.9) 0%, rgb(36 3 9 / 0.66) 52%, rgb(36 3 9 / 0.2) 100%);
        z-index: -1;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand img { display: block; }
      .brand b {
        font-family: 'Syne', sans-serif;
        font-weight: 600;
        font-size: 27px;
        letter-spacing: -0.03em;
      }
      .tag {
        font-family: 'Geist Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgb(251 234 230 / 0.62);
      }
      .mid {
        display: flex;
        align-items: center;
      }
      h1 {
        font-family: 'Syne', sans-serif;
        font-weight: 600;
        font-size: 62px;
        line-height: 1.02;
        letter-spacing: -0.038em;
        max-width: 15ch;
      }
      h1 em {
        font-style: normal;
        color: #ff8f7d;
        text-shadow: 2px 0 0 rgb(255 74 52 / 0.55);
      }
      .foot {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 32px;
      }
      .lead {
        font-size: 15px;
        line-height: 1.55;
        max-width: 46ch;
        color: rgb(251 234 230 / 0.72);
      }
      .chips {
        display: flex;
        gap: 6px;
      }
      .chips i {
        display: block;
        width: 26px;
        height: 26px;
        border-radius: 5px;
        box-shadow: inset 0 0 0 1px rgb(251 234 230 / 0.16);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="field"></div>
      <div class="scrim"></div>

      <div class="top">
        <div class="brand">
          <img src="mark-reverse.svg" width="40" height="40" alt="" />
          <b>Halation</b>
        </div>
        <span class="tag">Case 15 · adityahimaone.space</span>
      </div>

      <div class="mid">
        <h1>Light does not stop at the edge of what it <em>lights</em>.</h1>
      </div>

      <div class="foot">
        <p class="lead">
          Fifteen documented interface systems. Reeded prismatic glass, one coral spill, and a
          dual day/night scope built from the same eighteen primitives.
        </p>
        <div class="chips">
          <i style="background:#fdf1ec"></i>
          <i style="background:#ff4a34"></i>
          <i style="background:#b01f2d"></i>
          <i style="background:#240309"></i>
          <i style="background:#fbeae6"></i>
          <i style="background:#1c0b10"></i>
        </div>
      </div>

    </div>
  </body>
</html>
